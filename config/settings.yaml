# ============================================================================
# Kap's Retro Rescue deal finder — general settings
# ============================================================================

# --- Profit math ------------------------------------------------------------
# max_buy = sell_price − refurb_cost − profit tier
# Tiers drive alerts:  🔥 GREAT (≥ $50 est. profit) alert immediately
#                      ✅ GOOD  (≥ $40)             alert immediately
#                      🟡 MARGINAL (≥ $25)          hourly digest only
#                      ❌ below $25                  skipped
pricing:
  refurb_cost: 38            # all-in per unit: shell, buttons, retrobright,
                             # solder, packaging, payment processing
  profit_tiers:
    marginal: 25
    good: 40
    great: 50
  screen_repair_penalty: 45  # subtracted from est. profit when screen issues
                             # detected (DS screens cost $36-53)
  parts_credit_per_dud: 10   # $ of harvestable parts per expected dud in a lot

# --- Lot yield --------------------------------------------------------------
# Not every unit in a lot is salvageable. effective cost per good unit =
# (price + shipping − parts credit) / (quantity × yield).
# Yield only applies to lots (quantity >= 2).
yield:
  default: 0.75
  positive:                  # seller says they work, or cosmetic-only issues
    phrases: ["all power on", "all tested", "all working", "all functional",
              "all turn on", "everything works", "powers on", "power on fine",
              "all have broken hinges", "hinges only", "cosmetic only",
              "cosmetic issues only"]
    rate: 0.90
  negative:                  # worst matching phrase wins (lowest yield)
    - phrases: ["untested", "unknown condition", "no way to test",
                "can't test", "cannot test", "no idea if works",
                "don't know if it works"]
      rate: 0.70
    - phrases: ["some may not work", "sold as is", "sold as-is", "as-is", "as is"]
      rate: 0.65
    - phrases: ["for parts", "parts only", "not working", "non-working",
                "parts or repair", "parts/repair"]
      rate: 0.50

# --- Keyword intelligence ---------------------------------------------------
keywords:
  # Cheap fixes: these lower the listing price but cost almost nothing to fix.
  # Shown as "CHEAP FIX" in alerts (shell swap & retrobright already included
  # in the $38 refurb cost).
  cheap_fixes:
    - "broken hinge"
    - "hinge"
    - "yellowed"
    - "yellowing"
    - "discolored"
    - "sticky buttons"
    - "buttons don't work"
    - "unresponsive buttons"
    - "needs cleaning"
    - "dirty"
    - "grimy"
    - "scratched"
    - "cracked shell"
    - "cosmetic"
    - "no battery"
    - "missing battery cover"
    - "no charger"
    - "no stylus"
    - "battery corrosion"
    - "corroded contacts"
    - "won't hold charge"
    - "battery dead"
    - "loose charging port"
    - "charging port"
    - "missing screws"
    - "missing back cover"

  # Screen problems: fixable but expensive -> profit penalty (see pricing)
  screen_issues:
    - "cracked screen"
    - "broken screen"
    - "no display"
    - "black screen"
    - "white screen"
    - "dead pixels"
    - "lines on screen"
    - "screen doesn't work"
    - "screen does not work"
    - "needs new screen"
    - "needs new top screen"
    - "needs new bottom screen"
    - "needs screen"
    - "no top screen"
    - "no bottom screen"
    - "top screen broken"
    - "bottom screen broken"
    - "top screen cracked"
    - "bottom screen cracked"
    - "screen cracked"
    - "screen damage"
    - "screen issue"

  # Hard avoid: usually unrepairable or not worth the bench time
  avoid:
    - "water damage"
    - "liquid damage"
    - "was in water"
    - "flood damage"
    - "motherboard damage"
    - "board damage"
    - "shorted"
    - "burnt"
    - "burn marks"
    - "heavy corrosion"
    - "severe corrosion"
    - "missing motherboard"
    - "no internals"
    - "shell only"
    - "housing only"
    - "cartridge slot broken"
    - "modded"

  # Non-expert-seller signals: fewer bidders, often underpriced. Shown as a
  # note in alerts.
  underpriced_signals:
    - "estate sale"
    - "estate find"
    - "storage unit"
    - "storage locker"
    - "attic"
    - "basement find"
    - "grandma"
    - "cleaning out"
    - "clearing out"
    - "moving sale"
    - "garage find"
    - "no idea if works"
    - "don't know if it works"
    - "can't test"
    - "no way to test"

# --- Accessory noise filter (never consoles) --------------------------------
matching:
  exclude_always:
    - "shell"
    - "shells"
    - "housing"
    - "box only"
    - "manual only"
    - "charger only"
    - "charger lot"
    - "chargers"
    - "charging cable"
    - "power adapter"
    - "ac adapter"
    - "usg-002"     # DS Lite charger model number
    - "wap-002"     # 3DS charger model number
    - "ntr-002"     # DS charger model number
    - "ags-002"     # GBA SP charger model number
    - "screen display"   # replacement screens sold as parts
    - "screen only"
    - "display only"
    - "lcd"
    - "digitizer"
    - "motherboard"  # board-only listings (also catches "motherboard lot")
    - "mainboard"
    - "board only"
    - "pcb"
    - "replacement screen"
    - "screen replacement"
    - "battery cover"
    - "sticker"
    - "decal"
    - "empty box"

# --- Alerts & digest --------------------------------------------------------
notify:
  discord: true
  email: false
  instant_min_tier: good     # "great" = only 🔥 alerts instantly;
                             # "good" = 🔥 and ✅ alert instantly
  instant_max_per_run: 8     # cap one run's instant ping to the N best;
                             # the rest still appear in the hourly digest
digest:
  interval_hours: 3          # scheduled market pulse, every N hours
  top_n: 10                  # how many of the best deals the digest lists
  lookback_hours: 24         # digest picks the best from the last N hours
  search_results: 10         # how many listings !search returns

# --- Sources ----------------------------------------------------------------
sources:
  ebay:
    enabled: true
    max_results_per_search: 50
    ending_soon_hours: 2     # re-alert auctions ending within this window
  reddit:
    enabled: true
    subreddits: ["hardwareswap"]
    max_posts: 75
  mock:
    enabled: false

# --- Condition language (parts vs working label in alerts) ------------------
condition:
  parts_phrases:
    - "for parts"
    - "parts only"
    - "parts or repair"
    - "as-is"
    - "as is"
    - "not working"
    - "doesn't work"
    - "does not work"
    - "broken"
    - "cracked"
    - "no power"
    - "won't turn on"
    - "wont turn on"
    - "won't power"
    - "doesn't turn on"
    - "untested"
    - "for repair"
    - "needs repair"
    - "needs work"
